{% extends 'base.html' %}

{% block title %}Products{% endblock %}

{% block content %}
    <h1>Products</h1>
    <ul>
        {% for product in products %}
            <a href="{% url 'store:product_detail' product_pk=product.pk %}">
                <li>{{ product.name }} - ${{ product.price }}</li>
            </a>
        {% endfor %}
    </ul>
    <a type="button" class="btn btn-primary" href="{% url 'store:add_product' %}">Add Product</a>
{% endblock %}
